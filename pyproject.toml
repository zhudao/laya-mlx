[build-system]
# Match the validated metadata format accepted by the release Twine checks.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "laya-mlx"
version = "0.6.0"
description = "Native MLX inference for Laya typed decision models on Apple silicon"
keywords = ["mlx", "laya", "typed-decisions", "decision-model", "local-ai", "apple-silicon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "mlx>=0.32.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=1.26",
  "huggingface-hub>=0.34,<2",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "httpx>=0.27.0"]
mcp = ["mcp>=2.2.0"]
structured = ["pydantic>=2"]
calibration = ["torch>=2.14,<3"]
langchain = ["langchain-core>=0.2.0", "langgraph>=0.1.0"]
langgraph = ["langchain-core>=0.2.0", "langgraph>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
crewai = ["crewai>=0.28.0"]
agno = ["agno>=1.1.14,<2"]
dev = ["pytest>=8", "ruff>=0.12", "build>=1"]
reference = ["torch>=2.14,<3", "transformers>=5.17,<6", "safetensors>=0.6"]
benchmark = ["matplotlib>=3.10", "pyarrow>=18"]
demo = ["rich>=15,<16", "Pillow>=12,<13"]

[project.scripts]
laya-mlx-router = "laya_mlx.router_cli:main"
laya-mlx-serve = "laya_mlx.serve:main"
laya-mlx-evals = "laya_mlx.evals_cli:main"
laya-mlx-mcp-server = "laya_mlx.mcp.server:main"
laya-mlx = "laya_mlx.cli:main"
laya-snake = "laya_mlx.snake.cli:main"

[project.urls]
Repository = "https://github.com/mizorewww/laya-mlx"
Upstream = "https://github.com/NandhaKishorM/laya"
Documentation = "https://github.com/mizorewww/laya-mlx#readme"
Issues = "https://github.com/mizorewww/laya-mlx/issues"
Benchmarks = "https://github.com/mizorewww/laya-mlx/blob/main/BENCHMARKS.md"

[tool.hatch.build.targets.wheel]
packages = ["laya_mlx"]

[tool.hatch.build.targets.sdist]
include = ["/laya_mlx", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded Laya checkpoints"]

[tool.ruff]
line-length = 100
extend-exclude = [".upstream"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# CrewAI and the Snake demo currently require incompatible Rich major versions.
conflicts = [[{ extra = "crewai" }, { extra = "demo" }]]
