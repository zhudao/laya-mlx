name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NandhaKishorM/laya
          ref: fe9a6c35023a7d94102e7feaaeaae8857d9d1b07
          path: .upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,serve,mcp,structured]'
      - run: pytest -q tests/test_official_host.py tests/test_upstream_0417.py
      - run: python scripts/audit_public_api.py --package laya_mlx
      - run: python -m compileall -q laya_mlx tests scripts
  test:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      LAYA_MLX_TEST_DEVICE: cpu
      TOKENIZERS_PARALLELISM: "false"
      USE_TF: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NandhaKishorM/laya
          ref: fe9a6c35023a7d94102e7feaaeaae8857d9d1b07
          path: .upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,reference,demo,serve,mcp,structured,llamaindex]'
      - run: ruff check . && ruff format --check .
      # Run timing-sensitive upstream host contracts before native model tests,
      # in a separate process. Keep every upstream assertion and timeout unchanged.
      - name: Upstream host contracts
        run: pytest -q tests/test_official_host.py tests/test_official_contract.py
      # Hosted macOS 26 runners intermittently SIGBUS inside MLX's native FP16 CPU kernels in the
      # parallel-layout permutation test, depending on what earlier tests left in the process.
      # A fresh process passes (see the diagnostic step), and real Apple hardware passes either
      # way. Run that file in its own process; every assertion and tolerance is unchanged.
      - name: Parallel-layout native tests
        if: success() || failure()
        run: python -X faulthandler -m pytest -q tests/test_parallel_layout.py
      - name: Native and integration tests
        if: success() || failure()
        run: >-
          pytest -q --ignore=tests/test_official_contract.py --ignore=tests/test_official_host.py
          --ignore=tests/test_parallel_layout.py
      - name: Compare original upstream idle-window assertions
        if: failure()
        run: PYTHONPATH=.upstream python -m pytest .upstream/tests/test_serve.py -q -k idle_window
      - name: Diagnose native CPU failures
        if: failure()
        run: python -u -m scripts.diagnose_parallel_cpu
      - name: Show native crash reports
        if: failure()
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          folder = Path.home() / "Library/Logs/DiagnosticReports"
          for path in sorted(folder.glob("*.ips"), key=lambda p: p.stat().st_mtime)[-2:]:
              print(path.name)
              print(path.read_text()[:40000])
          PYCODE
      - run: python -m build
